name = "esseotoyikamav2"
main = "public/_worker.js"
compatibility_date = "2024-09-23"

# Cloudflare D1 Database binding
# Oluşturmak için: npx wrangler d1 create esse-db
# Şemayı yüklemek için: npx wrangler d1 execute esse-db --file=./schema.sql
[[d1_databases]]
binding = "DB"
database_name = "esse-db"
database_id = "esse-auto-provision-d1"

[site]
bucket = "./dist"
