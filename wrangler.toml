name = "esseotoyikamav2"
main = "public/_worker.js"
compatibility_date = "2024-09-23"

# Modern Cloudflare Workers Static Assets (Statik Dosyalar)
# dist klasöründeki React ve medya dosyalarını doğrudan Cloudflare Edge CDN üzerinden sunar
assets = { directory = "./dist", binding = "ASSETS" }

# Cloudflare D1 SQL Veritabanı Entegrasyonu:
# 1. Cloudflare hesabınızda D1 veritabanını oluşturmak için terminalde çalıştırın:
#    npx wrangler d1 create esse-db
# 2. Komut çıktısındaki "database_id" UUID değerini (örn: b46e91cb-xxxx-xxxx-xxxx-xxxxxxxxxxxx)
#    aşağıdaki satırlara ekleyip başlarındaki '#' karakterlerini kaldırın:
#
# [[d1_databases]]
# binding = "DB"
# database_name = "esse-db"
# database_id = "BURAYA_CLOUDFLARE_D1_UUID_YAZIN"


